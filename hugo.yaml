title: Viper Docs
baseURL: https://TheDJStudios.github.io/Viper-Docs/
enableRobotsTXT: true
enableGitInfo: true
defaultContentLanguage: en

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    - source: assets
      target: assets
    - source: static
      target: static

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  author:
    name: TheDJStudios
    email: null@tamastudios.us
  theme:
    default: system
    displayToggle: true
  page:
    width: wide
  navbar:
    width: wide
  footer:
    width: wide
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  editURL:
    base: "https://github.com/TheDJStudios/Viper-Docs/edit/main/content/"

menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: GitHub
      url: "https://github.com/TheDJStudios/Viper-Docs"
      weight: 2
      params:
        icon: github
